<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Welcome Back</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to manage your enterprise workforce.</p>

</div>
</div>

<button class="absolute inset-y-0 right-0 pr-md flex items-center text-on-surface-variant hover:text-on-surface focus:outline-none transition-colors" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span>

</div>
</div>

<script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                passwordIcon.innerText = 'visibility';
            }
        }

        // Add a subtle entrance animation delay for form children
        document.addEventListener('DOMContentLoaded', () => {
            const formElements = document.querySelectorAll('#loginForm > *');
            formElements.forEach((el, index) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                el.style.transition = `all 0.5s ease-out ${0.2 + (index * 0.05)}s`;
                
                setTimeout(() => {
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, 100);
            });
        });
    </script>
